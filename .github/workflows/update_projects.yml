name: Update Projects with AI

on:
  workflow_dispatch:
    inputs:
      update_existing:
        description: 'Re-analyze and update existing projects in projects.json'
        required: false
        default: false
        type: boolean
      include_private:
        description: 'Include private repositories when discovering new projects'
        required: false
        default: false
        type: boolean
      model:
        description: 'Free GitHub Models AI model to use'
        required: false
        default: 'openai/gpt-4o-mini'
        type: string
      force_deploy:
        description: 'Force build and deploy to GitHub Pages even if no projects changed'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  models: read

jobs:
  update-projects-with-ai:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Run AI project updater script
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GHP_TOKEN || secrets.GITHUB_TOKEN }}
          MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          UPDATE_EXISTING: ${{ inputs.update_existing }}
          INCLUDE_PRIVATE: ${{ inputs.include_private }}
          AI_MODEL: ${{ inputs.model || 'openai/gpt-4o-mini' }}
        run: python scripts/update_projects.py

      - name: Commit and push updated projects
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/projects.json src/i18n.js
          if git diff --staged --quiet; then
            echo "No changes to projects.json or i18n.js to commit."
            echo "committed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore(projects): auto-update portfolio projects via AI workflow"
            git push
            echo "committed=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Bun
        if: steps.commit.outputs.committed == 'true' || inputs.force_deploy == true
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies & build site
        if: steps.commit.outputs.committed == 'true' || inputs.force_deploy == true
        run: |
          bun install
          bun run build

      - name: Deploy to GitHub Pages
        if: steps.commit.outputs.committed == 'true' || inputs.force_deploy == true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build

      - name: Upload JSON Artifact
        uses: actions/upload-artifact@v4
        with:
          name: updated-projects-json
          path: |
            src/components/projects.json
            github_export_with_readmes.json
